name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build unsigned package
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          set -euo pipefail
          packaging/build-pkg.sh "$VERSION" artifacts
          shasum -a 256 "artifacts/ManageUsers-${VERSION}.pkg" > "artifacts/ManageUsers-${VERSION}.pkg.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ManageUsers ${{ steps.ver.outputs.VERSION }}
          body: Unsigned package built from this tag. Sign and notarize it with your own Developer ID before deployment.
          files: |
            artifacts/ManageUsers-${{ steps.ver.outputs.VERSION }}.pkg
            artifacts/ManageUsers-${{ steps.ver.outputs.VERSION }}.pkg.sha256
