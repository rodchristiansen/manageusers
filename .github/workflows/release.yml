name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build unsigned package
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          set -euo pipefail
          packaging/build-pkg.sh "$VERSION" artifacts
          shasum -a 256 "artifacts/ManageUsers-${VERSION}.pkg" > "artifacts/ManageUsers-${VERSION}.pkg.sha256"

      - name: Build unsigned Managed Users Cleanup package
        working-directory: ManagedUsersCleanup
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then export DEVELOPER_DIR="$XCODE/Contents/Developer"; fi
          GUI_VERSION=$(date -u '+%Y.%m.%d.%H%M')
          make pkg VERSION="$GUI_VERSION"
          cp "build/ManagedUsersCleanup-${GUI_VERSION}.pkg" ../artifacts/
          cd ../artifacts && shasum -a 256 "ManagedUsersCleanup-${GUI_VERSION}.pkg" > "ManagedUsersCleanup-${GUI_VERSION}.pkg.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ManageUsers ${{ steps.ver.outputs.VERSION }}
          body: Unsigned packages built from this tag, manageusers and the Managed Users Cleanup window. Sign and notarize them with your own Developer ID before deployment; the window's helper refuses every client until it is signed.
          files: |
            artifacts/ManageUsers-${{ steps.ver.outputs.VERSION }}.pkg
            artifacts/ManageUsers-${{ steps.ver.outputs.VERSION }}.pkg.sha256
            artifacts/ManagedUsersCleanup-*.pkg
            artifacts/ManagedUsersCleanup-*.pkg.sha256
