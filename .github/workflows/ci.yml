name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cli:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      # Every macOS job builds with Xcode 27, which the app icons need: an older
      # actool drops their light and dark appearances. The xcode-27 image ships
      # it; stop here if it is gone rather than build with another Xcode.
      - name: Select Xcode 27
        working-directory: .
        run: |
          set -euo pipefail
          XCODE=/Applications/Xcode_27.app
          if [ ! -d "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1 || true)
          fi
          if [ -z "$XCODE" ] || [ ! -d "$XCODE" ]; then
            echo "::error::Xcode 27 is not installed on this runner. Installed: $(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --show-sdk-version
      - name: Build and test the command-line tool
        run: |
          swift build
          swift test
      - name: Check the package layout
        run: |
          set -euo pipefail
          packaging/build-pkg.sh 2026.01.01.0000 pkgout
          files=$(pkgutil --payload-files pkgout/ManageUsers-2026.01.01.0000.pkg | grep -v '/\._')
          echo "$files"
          echo "$files" | grep -qx './usr/local/manageusers/manageusers'
          echo "$files" | grep -qx './usr/local/bin/manageusers'
          echo "$files" | grep -qx './Applications/Utilities/Managed Users Cleanup.app/Contents/MacOS/ManagedUsersCleanup'
          echo "$files" | grep -qx './Applications/Utilities/Managed Users Cleanup.app/Contents/MacOS/ManagedUsersCleanupHelper'
          echo "$files" | grep -qx './Library/LaunchDaemons/com.github.manageusers.helper.plist'
          ! echo "$files" | grep -q 'Library/Management'

  managed-users-cleanup:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: ManagedUsersCleanup
    steps:
      - uses: actions/checkout@v4
      # Every macOS job builds with Xcode 27, which the app icons need: an older
      # actool drops their light and dark appearances. The xcode-27 image ships
      # it; stop here if it is gone rather than build with another Xcode.
      - name: Select Xcode 27
        working-directory: .
        run: |
          set -euo pipefail
          XCODE=/Applications/Xcode_27.app
          if [ ! -d "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1 || true)
          fi
          if [ -z "$XCODE" ] || [ ! -d "$XCODE" ]; then
            echo "::error::Xcode 27 is not installed on this runner. Installed: $(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --show-sdk-version
      - name: Test and build the unsigned window
        run: |
          set -euo pipefail
          xcrun --show-sdk-version
          swift test
          make app
